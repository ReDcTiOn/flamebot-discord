# Продакшен-запуск: docker compose up -d --build
# Переменные берутся из файла .env рядом с этим файлом (образец: .env.example).
# Каждый сервис получает только свои секреты: бот не знает секрет OAuth, панель не знает токен бота.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flamebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: flamebot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flamebot -d flamebot"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Порт наружу не публикуется: база доступна только сервисам внутри сети compose.
    networks: [internal]

  migrate:
    build:
      context: .
      target: build
    command: ["pnpm", "-F", "@flamebot/core", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://flamebot:${POSTGRES_PASSWORD}@db:5432/flamebot
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  rating-bot:
    <<: *hardening
    build:
      context: .
      target: rating-bot
    environment:
      # Необязателен: токен задаётся в панели («Подключение»). Старый токен отсюда бот один раз
      # переносит в базу зашифрованным, после чего строку из .env можно удалить.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      GUILD_ID: ${GUILD_ID:?Задай GUILD_ID в .env}
      DATABASE_URL: postgresql://flamebot:${POSTGRES_PASSWORD}@db:5432/flamebot
    # Ключ шифрования токена. Только у этого сервиса, в базу не попадает.
    volumes:
      - rating-bot-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, egress]

  online-bot:
    <<: *hardening
    build:
      context: .
      target: online-bot
    environment:
      # Необязателен: ключ для паролей RCON и токенов бот хранит в своём томе и создаёт сам.
      # Если ключ задан здесь (как раньше), бот копирует его в том, и строку можно удалить.
      ONLINE_SECRET_KEY: ${ONLINE_SECRET_KEY:-}
      ALLOW_PRIVATE_RCON: ${ALLOW_PRIVATE_RCON:-false}
      DATABASE_URL: postgresql://flamebot:${POSTGRES_PASSWORD}@db:5432/flamebot
    volumes:
      - online-bot-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, egress]

  giveaway-bot:
    <<: *hardening
    build:
      context: .
      target: giveaway-bot
    environment:
      # Необязателен: токен задаётся в панели («Подключение»), старый отсюда переносится в базу.
      GIVEAWAY_DISCORD_TOKEN: ${GIVEAWAY_DISCORD_TOKEN:-}
      GUILD_ID: ${GUILD_ID}
      DATABASE_URL: postgresql://flamebot:${POSTGRES_PASSWORD}@db:5432/flamebot
    volumes:
      - giveaway-bot-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, egress]

  maps-bot:
    <<: *hardening
    build:
      context: .
      target: maps-bot
    environment:
      # Ключи RustMaps, S3, Pterodactyl, вебхук и токен Telegram задаются в панели («Карты вайпов» → «Подключение»).
      # PANEL_URL нужен только для ссылок «Открыть в панели» в Telegram.
      PANEL_URL: ${PANEL_URL:-}
      DATABASE_URL: postgresql://flamebot:${POSTGRES_PASSWORD}@db:5432/flamebot
    volumes:
      - maps-bot-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, egress]

  notice-bot:
    <<: *hardening
    build:
      context: .
      target: notice-bot
    environment:
      # Токен Telegram, вебхуки Discord, ключ ВКонтакте и gamestores задаются в панели
      # («Объявления о вайпах» → «Подключение»). PANEL_URL — для ссылок «Открыть в панели» в Telegram.
      PANEL_URL: ${PANEL_URL:-}
      DATABASE_URL: postgresql://flamebot:${POSTGRES_PASSWORD}@db:5432/flamebot
    volumes:
      - notice-bot-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, egress]

  panel:
    <<: *hardening
    build:
      context: .
      target: panel
    environment:
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Задай DISCORD_CLIENT_ID в .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Задай DISCORD_CLIENT_SECRET в .env}
      GUILD_ID: ${GUILD_ID}
      PANEL_URL: ${PANEL_URL:?Задай PANEL_URL в .env}
      SESSION_SECRET: ${SESSION_SECRET:?Задай SESSION_SECRET в .env}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      DATABASE_URL: postgresql://flamebot:${POSTGRES_PASSWORD}@db:5432/flamebot
    tmpfs:
      - /tmp
      - /app/apps/panel/.next/cache
    # Слушает только localhost. Наружу — через reverse proxy с HTTPS (см. docs/DEPLOY.md).
    # У тестовой копии на том же сервере свой порт: PANEL_PORT=3001.
    ports:
      - "127.0.0.1:${PANEL_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, egress]

networks:
  internal:
    internal: true
  egress: {}

volumes:
  pgdata:
  # Ключи шифрования токенов, по тому на бота. Потеряешь том — токены придётся ввести в панели заново.
  rating-bot-data:
  online-bot-data:
  giveaway-bot-data:
  maps-bot-data:
  notice-bot-data:
